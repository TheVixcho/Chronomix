[workspace]
resolver = "2"
members = [
    "crates/pedal-audio",
    "crates/pedal-engine",
    "crates/pedal-wine",
    "crates/pedal-app",
]
default-members = ["crates/pedal-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
eframe = "0.34"
egui = "0.34"
env_logger = "0.11"
hound = "3.5.1"
libloading = "0.8"
log = "0.4"
rfd = "0.17.0"
rtrb = "0.3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
vst3-host = { version = "0.11.1", default-features = false, features = ["cpal-backend"] }
