[workspace]
resolver = "2"
members = [
    "crates/pedal-audio",
    "crates/pedal-engine",
    "crates/pedal-wine",
    "crates/chronomix-ffi",
]
default-members = ["crates/chronomix-ffi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["TheVixcho"]
repository = "https://github.com/TheVixcho/chronomix"

[workspace.dependencies]
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
env_logger = "0.11"
hound = "3.5.1"
libloading = "0.8"
log = "0.4"
rtrb = "0.3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
vst3-host = { version = "0.11.1", default-features = false, features = ["cpal-backend"] }
