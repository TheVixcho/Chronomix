name: Release Multiplataforma (Windows .exe, Linux, macOS, ARM64)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
    paths:
      - "Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    name: Detectar Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_ver.outputs.version }}
      tag: ${{ steps.get_ver.outputs.tag }}
      should_release: ${{ steps.get_ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer versión de Cargo.toml o Tag
        id: get_ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VER="${TAG_NAME#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
            TAG_NAME="v${VER}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            elif git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-windows:
    name: Compilar Instalador Windows (.exe x64 y ARM64)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust Stable (x64 y ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Chronomix Windows x64 y ARM64
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin chronomix
          cargo build --release --target aarch64-pc-windows-msvc --bin chronomix

      - name: Crear Instaladores .exe con Inno Setup (Licencia MIT + Acceso Directo)
        shell: pwsh
        run: |
          $ver = "${{ needs.detect-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path target\release | Out-Null

          Copy-Item "target\x86_64-pc-windows-msvc\release\chronomix.exe" "target\release\chronomix.exe" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\windows\chronomix.iss"
          Move-Item "dist\Chronomix-Setup-v$ver-Windows-x64.exe" "dist\Chronomix-Setup-Windows-x64.exe" -Force

          Copy-Item "target\aarch64-pc-windows-msvc\release\chronomix.exe" "target\release\chronomix.exe" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\windows\chronomix.iss"
          Move-Item "dist\Chronomix-Setup-v$ver-Windows-x64.exe" "dist\Chronomix-Setup-Windows-ARM64.exe" -Force

      - name: Guardar Artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-linux:
    name: Compilar Linux (x86_64 y ARM64)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch_label: x86_64
          - runner: ubuntu-24.04-arm
            arch_label: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Chronomix (Linux ${{ matrix.arch_label }})
        run: cargo build --release --bin chronomix

      - name: Empaquetar Chronomix-Linux-${{ matrix.arch_label }}.tar.gz
        run: |
          mkdir -p dist
          tar -czf "dist/Chronomix-Linux-${{ matrix.arch_label }}.tar.gz" -C target/release chronomix -C ../.. LICENSE README.md

      - name: Guardar Artefactos de Linux (${{ matrix.arch_label }})
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-${{ matrix.arch_label }}
          path: dist/*

  build-macos:
    name: Compilar macOS (.dmg Universal Apple Silicon + Intel)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust Stable (Apple Silicon ARM64 + Intel x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Chronomix (macOS ARM64 y x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin --bin chronomix
          cargo build --release --target x86_64-apple-darwin --bin chronomix

      - name: Crear Bundle Universal Chronomix.app, .dmg y .tar.gz
        run: |
          VER="${{ needs.detect-version.outputs.version }}"
          mkdir -p dist
          APP_DIR="dist/bundle/Chronomix.app/Contents"
          mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources"

          lipo -create \
            target/aarch64-apple-darwin/release/chronomix \
            target/x86_64-apple-darwin/release/chronomix \
            -output "${APP_DIR}/MacOS/chronomix"
          chmod +x "${APP_DIR}/MacOS/chronomix"

          cat > "${APP_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>chronomix</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.thevixcho.chronomix</string>
              <key>CFBundleName</key>
              <string>Chronomix</string>
              <key>CFBundleVersion</key>
              <string>${VER}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VER}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          tar -czf "dist/Chronomix-macOS.tar.gz" -C "dist/bundle" Chronomix.app
          ln -s /Applications "dist/bundle/Applications"
          hdiutil create -volname "Chronomix v${VER}" -srcfolder "dist/bundle" -ov -format UDZO "dist/Chronomix-macOS.dmg"
          rm -rf "dist/bundle"

      - name: Guardar Artefactos de macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  publish-release:
    name: Publicar GitHub Release
    needs:
      - detect-version
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los instaladores compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Crear GitHub Release con Instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: "Chronomix v${{ needs.detect-version.outputs.version }} — Studio Audio DAW & VST Host"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Chronomix v${{ needs.detect-version.outputs.version }}
            **Creado por TheVixcho** · **Licencia MIT**

            ### Descargas Directas (Instaladores Estándar)
            - **Windows x64 (Instalador `.exe`)**: `Chronomix-Setup-Windows-x64.exe`
            - **Windows ARM64 (Instalador `.exe`)**: `Chronomix-Setup-Windows-ARM64.exe`
            - **Linux x86_64**: `Chronomix-Linux-x86_64.tar.gz`
            - **Linux ARM64**: `Chronomix-Linux-ARM64.tar.gz`
            - **macOS Universal (Apple Silicon + Intel)**: `Chronomix-macOS.dmg`

            ### Instalación Rápida en 1 Comando (Linux & macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/TheVixcho/chronomix/main/install.sh | bash
            ```
          files: release-assets/*
