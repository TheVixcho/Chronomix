name: Release Multiplataforma (Windows .exe, Linux, macOS)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
    paths:
      - "Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    name: Detectar Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_ver.outputs.version }}
      tag: ${{ steps.get_ver.outputs.tag }}
      should_release: ${{ steps.get_ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer versión de Cargo.toml o Tag
        id: get_ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VER="${TAG_NAME#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
            TAG_NAME="v${VER}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            elif git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-windows:
    name: Compilar Instalador Windows (.exe)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Chronomix (.exe)
        run: cargo build --release --bin chronomix

      - name: Crear Instalador .exe con Inno Setup (Licencia MIT + Acceso Directo)
        shell: pwsh
        run: |
          $ver = "${{ needs.detect-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\windows\chronomix.iss"
          Copy-Item "dist\Chronomix-Setup-v$ver-Windows-x64.exe" "dist\Chronomix-Setup-Windows-x64.exe"
          Compress-Archive -Path "target\release\chronomix.exe", "LICENSE", "README.md" -DestinationPath "dist\Chronomix-Portable-v$ver-Windows-x64.zip" -Force

      - name: Guardar Artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-linux:
    name: Compilar Instalador Linux (.deb y .tar.gz)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            wine64-tools

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Chronomix (Linux x86_64)
        run: cargo build --release --bin chronomix

      - name: Empaquetar .tar.gz y Paquete Instalador .deb
        run: |
          VER="${{ needs.detect-version.outputs.version }}"
          mkdir -p dist

          tar -czf "dist/Chronomix-Linux-x86_64.tar.gz" -C target/release chronomix -C ../.. LICENSE README.md
          cp "dist/Chronomix-Linux-x86_64.tar.gz" "dist/Chronomix-v${VER}-Linux-x86_64.tar.gz"

          DEB_DIR="dist/chronomix_${VER}_amd64"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/doc/chronomix"

          cp target/release/chronomix "${DEB_DIR}/usr/bin/chronomix"
          chmod 755 "${DEB_DIR}/usr/bin/chronomix"
          cp LICENSE "${DEB_DIR}/usr/share/doc/chronomix/copyright"

          cat > "${DEB_DIR}/usr/share/applications/chronomix.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Chronomix
          Comment=Studio Audio DAW & VST2/VST3 Host by TheVixcho
          Exec=/usr/bin/chronomix
          Terminal=false
          Categories=AudioVideo;Audio;Music;
          StartupNotify=true
          EOF

          cat > "${DEB_DIR}/DEBIAN/control" <<EOF
          Package: chronomix
          Version: ${VER}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: TheVixcho <https://github.com/TheVixcho>
          Description: Chronomix Studio Audio DAW and VST2/VST3 Host
           Cross-platform digital audio workstation, digital mixer, and VST2/VST3 host
           licensed under MIT by TheVixcho.
          EOF

          dpkg-deb --build "${DEB_DIR}" "dist/chronomix_${VER}_amd64.deb"
          cp "dist/chronomix_${VER}_amd64.deb" "dist/chronomix_latest_amd64.deb"
          rm -rf "${DEB_DIR}"
          cp install.sh dist/install.sh

      - name: Guardar Artefactos de Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-macos:
    name: Compilar Instalador macOS (.dmg y .app)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Chronomix (macOS)
        run: cargo build --release --bin chronomix

      - name: Crear Bundle Chronomix.app e Instalador .dmg
        run: |
          VER="${{ needs.detect-version.outputs.version }}"
          mkdir -p dist
          APP_DIR="dist/bundle/Chronomix.app/Contents"
          mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources"

          cp target/release/chronomix "${APP_DIR}/MacOS/chronomix"
          chmod +x "${APP_DIR}/MacOS/chronomix"

          cat > "${APP_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>chronomix</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.thevixcho.chronomix</string>
              <key>CFBundleName</key>
              <string>Chronomix</string>
              <key>CFBundleVersion</key>
              <string>${VER}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VER}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          ln -s /Applications "dist/bundle/Applications"
          hdiutil create -volname "Chronomix v${VER}" -srcfolder "dist/bundle" -ov -format UDZO "dist/Chronomix-v${VER}-macOS.dmg"
          cp "dist/Chronomix-v${VER}-macOS.dmg" "dist/Chronomix-macOS.dmg"
          rm -f "dist/bundle/Applications"
          tar -czf "dist/Chronomix-macOS.tar.gz" -C "dist/bundle" Chronomix.app
          rm -rf "dist/bundle"

      - name: Guardar Artefactos de macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  publish-release:
    name: Publicar GitHub Release
    needs:
      - detect-version
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los instaladores compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Crear GitHub Release con Instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: "Chronomix v${{ needs.detect-version.outputs.version }} — Studio Audio DAW & VST Host"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Chronomix v${{ needs.detect-version.outputs.version }}
            **Creado por TheVixcho** · **Licencia MIT**

            ### Descargas Directas (Instaladores Oficiales)
            - **Windows (x64 Instalador con acceso directo en Escritorio)**: `Chronomix-Setup-v${{ needs.detect-version.outputs.version }}-Windows-x64.exe`
            - **Linux (Debian / Ubuntu / Mint)**: `chronomix_${{ needs.detect-version.outputs.version }}_amd64.deb`
            - **macOS (Apple Silicon / Intel Disk Image)**: `Chronomix-v${{ needs.detect-version.outputs.version }}-macOS.dmg`

            ### Instalación Rápida en 1 Comando (Linux & macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/TheVixcho/chronomix/main/install.sh | bash
            ```
          files: release-assets/*
